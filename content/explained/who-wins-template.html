/* ===================== build ===================== */
document.getElementById("chap").innerHTML = CH.map(() => "<i></i>").join("");
document.getElementById("txts").innerHTML = CH.map((c, i) => `<div class="txt" data-i="${i}"><div class="kick">${c.kick}</div><h1 class="ttl">${c.title.map(([w, k]) => `<span class="w ${k}">${w}</span>`).join("")}</h1>
  <div class="cap">${c.caps.map(([s, h]) => `<p data-s="${s}">${h}</p>`).join("")}</div>${c.cta ? `<div class="ctaw"><div class="ask" id="cta1">who's your pick? 👇</div><br><div class="follow" id="cta2"><span class="plus">+</span><span>FOLLOW FOR MORE <b>F1 EXPLAINED</b></span></div></div>` : ""}</div>`).join("");
document.getElementById("gbox").innerHTML = G.map((g, i) => `<div class="g" data-i="${i}">${g}</div>`).join("");
document.getElementById("snow").innerHTML = Array.from({ length: 40 }, () => "<i></i>").join("");
const txts = [...document.querySelectorAll(".txt")], gs = [...document.querySelectorAll(".g")], chapDots = [...document.querySelectorAll("#chap i")], flakes = [...document.querySelectorAll("#snow i")];
const $ = (id) => document.getElementById(id), op = (el, v) => el && el.setAttribute("opacity", v), all = (sel) => [...document.querySelectorAll(sel)];

function seek(t) {
  CH.forEach((c, i) => {
    const lt = t - T0[i], last = i === CH.length - 1;
    const enter = i === 0 ? 1 : clamp((lt + XF) / XF), exit = last ? 0 : clamp((lt - (c.d - XF)) / XF), vis = enter > 0 && exit < 1;
    const tx = txts[i], g = gs[i]; tx.style.display = g.style.display = vis ? "block" : "none"; if (!vis) return;
    tx.style.opacity = easeOut(enter) * (1 - easeIn(exit)); tx.style.transform = `translateY(${(1 - easeOut(enter)) * 40 - easeIn(exit) * 40}px)`;
    tx.querySelectorAll(".ttl .w").forEach((w, k) => { const p = clamp((lt - k * 0.15) / 0.35); w.style.opacity = p; w.style.transform = `translateY(${(1 - easeOut(p)) * 34}px)`; });
    const ps = [...tx.querySelectorAll(".cap p")]; ps.forEach((p, k) => { const s = +p.dataset.s, e = k < ps.length - 1 ? +ps[k + 1].dataset.s : 1e9;
      p.style.opacity = clamp((lt - s) / 0.4) * (1 - clamp((lt - e + 0.3) / 0.3)); p.style.transform = `translateY(${(1 - easeOut(clamp((lt - s) / 0.4))) * 20}px)`; });
    const f = c.focus || [500, 400]; g.style.transformOrigin = `${f[0] / 10}% ${f[1] / 8}%`;
    g.style.opacity = easeOut(enter) * (1 - easeIn(exit)); g.style.transform = `scale(${(0.86 + 0.14 * easeOut(enter)) * (c.focus ? 1 + 1.8 * easeIn(exit) : 1)})`;
    A[i](lt);
  });
  $("prog").style.width = (100 * t / DURATION) + "%";
  const ci = Math.max(0, T0.findIndex((s, i) => t >= s && t < s + CH[i].d)); chapDots.forEach((d, k) => d.classList.toggle("on", k <= ci));
  $("src").textContent = CH[ci].src;
  const cold = clamp((t - T0[1] + 0.5) / 1) * clamp((T0[3] - t) / 0.8); $("snow").style.opacity = cold * 0.65;
  if (cold > 0) flakes.forEach((fl, i) => { const sp = 60 + 80 * rnd(i), sz = 3 + 7 * rnd(i + 99); fl.style.width = fl.style.height = sz + "px"; fl.style.opacity = 0.2 + 0.5 * rnd(i + 7);
    fl.style.left = (SW * rnd(i + 31) + 30 * Math.sin(t * 0.8 + i)) + "px"; fl.style.top = (((t * sp + SH * rnd(i + 57)) % (SH - 100)) + 60) + "px"; });
}
const A = [
  (lt) => { $("g0l").style.strokeDashoffset = 1 - easeInOut(clamp((lt - 0.2) / 3.0)); const q = clamp((lt - 3.4) / 0.5); op($("g0q"), q); $("g0q").setAttribute("transform", `translate(500 400) scale(${0.6 + 0.4 * back(q)}) translate(-500 -400)`); },
  (lt) => { const beat = (s0, s1) => clamp((lt - s0) / 0.5) * (1 - clamp((lt - s1 + 0.4) / 0.4));
    op($("b1a"), beat(0, 5.4)); op($("b1b"), beat(5.2, 11.2)); op($("b1c"), beat(11.0, 17.2)); op($("b1d"), beat(17.0, 99));
    const heatCol = (h) => h > 0.66 ? "#FF7A1A" : h > 0.33 ? "#FFB000" : "#7FD3FF";
    // A: the tyre warms to the window
    const h = easeInOut(clamp((lt - 0.8) / 3.4)), temp = 20 + 80 * h; $("b1fill").setAttribute("y", 556 - 342 * h); $("b1fill").setAttribute("height", 342 * h); $("b1fill").setAttribute("fill", temp > 85 ? "#FF7A1A" : temp > 50 ? "#FFB000" : "#7FD3FF");
    $("b1t").textContent = Math.round(temp) + "°C"; $("b1n").setAttribute("transform", `rotate(${-90 + 180 * temp / 160} 760 470)`);
    // B: car brakes, then turns; tyres heat up
    const pB = $("b1path"), LB = pB.getTotalLength(), qB = easeInOut(clamp((lt - 5.6) / 5.0)), at = (path, L, q) => { const a = path.getPointAtLength(L * q), b = path.getPointAtLength(Math.min(L, L * q + 2)); return [a.x, a.y, Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI + 90]; };
    const [bx, by, br] = at(pB, LB, qB); $("b1carB").setAttribute("transform", `translate(${bx} ${by}) rotate(${br})`);
    const braking = qB > 0.12 && qB < 0.42, corner = qB >= 0.42 && qB < 0.8, hb = clamp((qB - 0.12) / 0.7);
    $("b1carB").querySelectorAll(".disc").forEach((d) => op(d, braking ? 0.9 : hb > 0.3 ? 0.35 : 0)); $("b1carB").querySelectorAll(".ty").forEach((t) => t.setAttribute("fill", heatCol(hb)));
    op($("b1l1"), clamp((qB - 0.12) / 0.06)); op($("b1l2"), clamp((qB - 0.45) / 0.06)); op($("b1arr"), corner ? 1 : 0); $("b1arr").setAttribute("transform", `translate(${bx} ${by}) rotate(${br - 90})`);
    // C: straight, cold air, tyres cool down
    const c = clamp((lt - 11.4) / 5.0); $("b1dash").setAttribute("transform", `translate(0 ${(lt * 900) % 80})`);
    $("b1carC").querySelectorAll(".ty").forEach((t) => t.setAttribute("fill", heatCol(1 - c))); $("b1carC").querySelectorAll(".disc").forEach((d) => op(d, 0));
    all(".wd").forEach((w) => { const k = +w.dataset.k, x = 300 + ((k * 137) % 400), y = ((lt * (700 + (k % 5) * 90) + k * 61) % 820) - 60; w.setAttribute("transform", `translate(${x} ${y})`); });
    op($("b1cl"), clamp((lt - 11.8) / 0.4)); op($("b1strip"), clamp((lt - 13.4) / 0.5));
    // D: next corner on cold tyres: slides wide, grip drains, rubber specks
    const pD = $("b1slide"), LD = pD.getTotalLength(), qD = easeInOut(clamp((lt - 17.4) / 3.6)), [dx, dy, dr] = at(pD, LD, qD), slideAmt = clamp((qD - 0.35) / 0.4);
    $("b1carD").setAttribute("transform", `translate(${dx} ${dy}) rotate(${dr + 14 * slideAmt * Math.sin(lt * 9)})`); $("b1carD").querySelectorAll(".ty").forEach((t) => t.setAttribute("fill", "#7FD3FF"));
    $("b1trail").style.strokeDashoffset = 1 - qD; op($("b1sl"), clamp((lt - 19.0) / 0.4)); $("b1grip").setAttribute("height", 248 * (1 - 0.75 * slideAmt)); $("b1grip").setAttribute("y", 6 + 248 * 0.75 * slideAmt);
    $("b1grip").setAttribute("fill", slideAmt > 0.5 ? "#FF3B30" : "#5BE38F");
    all(".spk").forEach((p, k) => { const o = clamp((slideAmt - k / 20) * 3); op(p, o * 0.9); p.setAttribute("cx", dx + 40 * Math.cos(k * 1.7) + 18 * Math.sin(lt * 3 + k)); p.setAttribute("cy", dy + 50 * Math.sin(k * 2.3)); }); },
  (lt) => { const a = 1 - clamp((lt - 12.4) / 0.6), b = clamp((lt - 12.8) / 0.6); op($("g2a"), a); op($("g2b"), b);
    all(".g2card").forEach((c) => { const k = +c.dataset.k, p = clamp((lt - 0.8 - k * 1.1) / 0.45); op(c, p); c.setAttribute("transform", `translate(0 ${(1 - easeOut(p)) * 40})`); });
    const s = clamp((lt - 6.4) / 0.4); op($("g2stamp"), s); $("g2stamp").setAttribute("transform", `translate(500 400) rotate(-8) scale(${0.6 + 0.4 * back(s)})`);
    all(".g2b").forEach((r) => { const k = +r.dataset.k; r.style.transform = `scaleX(${easeOut(clamp((lt - 13.6 - k * 0.5) / 0.8))})`; });
    all(".g2v").forEach((r) => { const k = +r.dataset.k; r.style.opacity = clamp((lt - 14.2 - k * 0.5) / 0.4); }); op($("g2note"), clamp((lt - 18.4) / 0.5));
    all(".g2bar").forEach((r) => { const k = +r.dataset.k; r.style.opacity = lt > 19 && (k === 2 || k === 3) ? 0.75 + 0.25 * Math.sin(lt * 5) : 1; }); },
  (lt) => { all(".g3c").forEach((c) => { const k = +c.dataset.k; op(c, clamp((lt - 0.6 - k * 0.6) / 0.4)); });
    all(".g3l").forEach((l) => { const k = +l.dataset.k; l.style.strokeDashoffset = 1 - easeInOut(clamp((lt - 1.0 - k * 0.6) / 2.4)); });
    all(".g3w").forEach((w) => { const k = +w.dataset.k; op(w, clamp((lt - 7.4 - k * 0.7) / 0.4)); }); },
  (lt) => { all(".g4b").forEach((b) => { const k = +b.dataset.k; b.style.transform = `scaleX(${easeOut(clamp((lt - 0.8 - k * 0.3) / 0.9))})`; });
    all(".g4v").forEach((v) => { const k = +v.dataset.k; v.textContent = Math.round(+v.dataset.v * easeOut(clamp((lt - 0.8 - k * 0.3) / 0.9))); });
    op($("g4wl"), clamp((lt - 7.4) / 0.4)); all(".g4w").forEach((w) => { const k = +w.dataset.k; op(w, clamp((lt - 7.8 - k * 0.5) / 0.4)); }); },
  (lt) => { all(".g5b").forEach((b) => { const k = +b.dataset.k; b.style.transform = `scaleX(${easeOut(clamp((lt - 1.4 - k * 0.45) / 1.0))})`; });
    all(".g5v").forEach((v) => { const k = +v.dataset.k; v.textContent = Math.round(+v.dataset.v * easeOut(clamp((lt - 1.4 - k * 0.45) / 1.0))) + "%"; });
    const a = $("cta1"), b = $("cta2"), p = clamp((lt - 12.0) / 0.45), q = clamp((lt - 13.4) / 0.45);
    if (a) { a.style.opacity = p; a.style.transform = `rotate(-3deg) scale(${0.6 + 0.4 * back(p)})`; } if (b) { b.style.opacity = q; b.style.transform = `scale(${0.6 + 0.4 * back(q)})`; } },
];
async function renderSoundtrack(rate) { const ctx = new OfflineAudioContext(2, Math.ceil(rate * DURATION), rate); return ctx.startRendering(); }   // silent: voiceover goes on in the edit
window.reel = { DURATION, seek, renderSoundtrack, T0, CH, W: SW, H: SH };
seek(location.hash ? +location.hash.slice(1) : 4);
