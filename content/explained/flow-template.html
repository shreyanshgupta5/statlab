  return `<svg viewBox="0 0 1000 800"><polyline points="${lapPts(sx, sx, ox, oy)}" fill="none" stroke="#141E2A" stroke-width="32" stroke-linejoin="round"/>${segsMap}

    <g id="g4slow" opacity="0"><circle cx="${ox + LAP[iMin][0] * sx}" cy="${oy + LAP[iMin][1] * sx}" r="34" fill="none" stroke="#FF7A1A" stroke-width="5"/><text x="${ox + LAP[iMin][0] * sx - 44}" y="${oy + LAP[iMin][1] * sx + 8}" text-anchor="end" class="ledt" font-size="34" fill="#FF7A1A">${Math.round(LAP[iMin][2])} KM/H</text></g></svg>`; })();

// 6 · top-10 stints, 2023-25
G[6] = (() => { const C = { SOFT: "#E8002D", MEDIUM: "#FFD400", HARD: "#F2F2F0", INTERMEDIATE: "#3CB043", WET: "#0067FF" }, X = (l) => 140 + 820 * (l - 1) / 50;
  let y = 60, out = ""; Object.keys(STINTS).sort().forEach((yr, b) => {

        st.map(([c, a, z]) => `<rect x="${X(a)}" y="${yy}" width="${Math.max(2, X(z + 1) - X(a) - 3)}" height="13" rx="3" fill="${C[c] || "#888"}"/>`).join("") +

    y += 44 + 10 * 17 + 34; });
  return `<svg viewBox="0 0 1000 800">${out}<text x="140" y="790" class="lbl" style="font-size:16px">LAP 1</text><text x="960" y="790" text-anchor="end" class="lbl" style="font-size:16px">LAP 50</text>

// 7 · the 2026 title fight + lights-out time
G[7] = `<svg viewBox="0 0 1000 800"><text x="80" y="140" class="lbl">2026 STANDINGS · AFTER ROUND 20</text>
  ${[["ANT", 390, "#27F4D2"], ["VER", 279, "#3671C6"], ["RUS", 262, "#27F4D2"], ["HAM", 261, "#E8002D"]].map(([c, v, col], k) => `<g class="g7r" data-k="${k}"><text x="80" y="${226 + k * 92}" class="ledt" font-size="40" fill="#F2F2F0">${c}</text>

  <g id="g7t" opacity="0"><rect x="80" y="590" width="840" height="140" rx="20" fill="#0A0A08" stroke="#3A3418" stroke-width="3"/><text x="120" y="650" class="lbl" style="fill:#FFB000">LIGHTS OUT IN LAS VEGAS</text><text x="120" y="706" class="ledt" font-size="46" fill="#F2F2F0">SAT 21 NOV · 8PM LOCAL</text></g></svg>`;

/* ===================== build the page ===================== */
document.getElementById("chap").innerHTML = CH.map(() => "<i></i>").join("");
document.getElementById("txts").innerHTML = CH.map((c, i) => `<div class="txt" data-i="${i}"><div class="kick">${c.kick}</div><h1 class="ttl">${c.title.map(([w, k]) => `<span class="w ${k}">${w}</span>`).join("")}</h1>
  <div class="cap">${c.caps.map(([s, h]) => `<p data-s="${s}">${h}</p>`).join("")}</div>${c.cta ? `<div class="ctaw"><div class="follow" id="ctaf"><span class="plus">+</span><span>FOLLOW FOR MORE <b>F1 EXPLAINED</b></span></div></div>` : ""}</div>`).join("");
document.getElementById("gbox").innerHTML = G.map((g, i) => `<div class="g" data-i="${i}">${g}</div>`).join("");
document.getElementById("snow").innerHTML = Array.from({ length: 44 }, () => "<i></i>").join("");
// skyline for the first and last chapters
(() => { const sky = document.getElementById("sky"), w = SW, h = MODE === "land" ? 220 : 330; sky.setAttribute("viewBox", `0 0 ${w} ${h}`); sky.style.height = h + "px"; let s = "", x = 0, k = 0;
  while (x < w) { const bw = 40 + 70 * rnd(k), bh = h * (0.35 + 0.55 * rnd(k + 50)); s += `<rect x="${x}" y="${h - bh}" width="${bw}" height="${bh}" fill="#11141C" stroke="#232A38" stroke-width="2"/>`;
    for (let wy = h - bh + 14; wy < h - 10; wy += 22) for (let wx = x + 8; wx < x + bw - 10; wx += 16) if (rnd(wx * 3 + wy) > 0.55) s += `<rect x="${wx}" y="${wy}" width="6" height="10" fill="${rnd(wx + wy) > 0.8 ? "#FF3EA5" : "#FFC94A"}" opacity=".7"/>`;
    x += bw + 4; k++; } sky.innerHTML = s; })();
const txts = [...document.querySelectorAll(".txt")], gs = [...document.querySelectorAll(".g")], chapDots = [...document.querySelectorAll("#chap i")], flakes = [...document.querySelectorAll("#snow i")];
const $ = (id) => document.getElementById(id), op = (el, v) => el && el.setAttribute("opacity", v);
const lapAt = (f) => { const i = Math.min(N - 1, Math.max(0, Math.floor(f))), k = f - i, a = LAP[i], b = LAP[i + 1]; return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k, i]; };

/* ===================== timeline ===================== */
function seek(t) {
  CH.forEach((c, i) => {
    const lt = t - T0[i], last = i === CH.length - 1;
    const enter = i === 0 ? 1 : clamp((lt + XF) / XF), exit = last ? 0 : clamp((lt - (c.d - XF)) / XF), vis = enter > 0 && exit < 1;
    const tx = txts[i], g = gs[i];
    tx.style.display = g.style.display = vis ? "block" : "none"; if (!vis) return;
    tx.style.opacity = easeOut(enter) * (1 - easeIn(exit)); tx.style.transform = `translateY(${(1 - easeOut(enter)) * 40 - easeIn(exit) * 40}px)`;
    tx.querySelectorAll(".ttl .w").forEach((w, k) => { const p = clamp((lt - k * 0.16) / 0.35); w.style.opacity = p; w.style.transform = `translateY(${(1 - easeOut(p)) * 34}px)`; });
    const ps = [...tx.querySelectorAll(".cap p")]; ps.forEach((p, k) => { const s = +p.dataset.s, e = k < ps.length - 1 ? +ps[k + 1].dataset.s : 1e9;
      p.style.opacity = clamp((lt - s) / 0.4) * (1 - clamp((lt - e + 0.3) / 0.3)); p.style.transform = `translateY(${(1 - easeOut(clamp((lt - s) / 0.4))) * 20}px)`; });
    // camera: settle in from slightly small, leave by zooming into the focal point
    const f = c.focus || [500, 400]; g.style.transformOrigin = `${f[0] / 10}% ${f[1] / 8}%`;
    g.style.opacity = easeOut(enter) * (1 - easeIn(exit)); g.style.transform = `scale(${(0.86 + 0.14 * easeOut(enter)) * (c.focus ? 1 + 2.2 * easeIn(exit) : 1 - 0.1 * exit)})`;
    A[i](lt, c.d);
  });
  $("prog").style.width = (100 * t / DURATION) + "%";
  const ci = Math.max(0, T0.findIndex((s, i) => t >= s && t < s + CH[i].d)); chapDots.forEach((d, k) => d.classList.toggle("on", k <= (ci < 0 ? CH.length - 1 : ci)));
  $("src").textContent = (CH[ci] || CH[CH.length - 1]).src;
  const sky = clamp(1 - (t - T0[1] + 1) / 1) + clamp((t - T0[7] + 0.5) / 1); $("sky").style.opacity = Math.min(1, sky) * 0.9;
  const cold = clamp((t - T0[2] + 0.4) / 1) * clamp((T0[6] - t) / 0.8); $("snow").style.opacity = cold * 0.7;
  if (cold > 0) flakes.forEach((fl, i) => { const sp = 60 + 80 * rnd(i), sz = 3 + 7 * rnd(i + 99); fl.style.width = fl.style.height = sz + "px"; fl.style.opacity = 0.2 + 0.5 * rnd(i + 7);
    fl.style.left = (SW * rnd(i + 31) + 30 * Math.sin(t * 0.8 + i)) + "px"; fl.style.top = (((t * sp + SH * rnd(i + 57)) % (SH - 100)) + 60) + "px"; });
}
/* per-chapter animation, lt = seconds into the chapter */
const A = [
  (lt) => { const p = easeInOut(clamp((lt - 0.3) / 3.2)); $("g0line").style.strokeDashoffset = 1 - p;
    const [x, y] = lapAt((lt < 3.5 ? p : ((lt - 3.5) / 5) % 1) * N); $("g0car").setAttribute("transform", `translate(${286 + x * 0.72} ${40 + y * 0.72})`); op($("g0t"), clamp((lt - 2.5) / 0.6)); },
  (lt) => { const a = 1 - clamp((lt - 5.8) / 0.6), b = clamp((lt - 6.0) / 0.6); op($("g1a"), a); op($("g1b"), b);
    $("g1curve").style.strokeDashoffset = 1 - easeInOut(clamp((lt - 0.3) / 1.4));
    const c = 15 + 85 * easeInOut(clamp((lt - 1.6) / 2.6)), gr = Math.exp(-Math.pow((c - 100) / 32, 2)), X = 90 + c * 5.2, Y = 600 - gr * 440;
    $("g1dot").setAttribute("cx", X); $("g1dot").setAttribute("cy", Y); $("g1dot").setAttribute("fill", c > 84 ? "#5BE38F" : "#7FD3FF");
    $("g1v").setAttribute("x", X); $("g1v").setAttribute("y", Y - 34); $("g1v").textContent = Math.round(c) + "°C"; $("g1v").setAttribute("fill", c > 84 ? "#5BE38F" : "#7FD3FF");
    const s = [7.2, 9.0, 10.8].map((s0) => clamp((lt - s0) / 0.5)); [0, 1, 2].forEach((k) => op($("g1l" + k), s[k]));
    const heat = (s[0] + s[1] + s[2]) / 3; document.querySelectorAll(".g1w").forEach((w, k) => { const r = w.querySelector("rect"), d = w.querySelector(".g1disc");
      r.setAttribute("fill", heat > 0.6 ? "#FF7A1A" : heat > 0.3 ? "#FFB000" : "#7FD3FF"); op(d, s[0] * (0.5 + 0.5 * Math.sin(lt * 9 + k)));
      w.setAttribute("transform", w.getAttribute("transform").replace(/rotate\([^)]*\)/, "") + (s[2] > 0 ? ` rotate(${6 * s[2] * Math.sin(lt * 14 + k)})` : "")); });
    op($("g1arrows"), s[1] * (lt < 10.6 ? 1 : 0.5)); $("g1car").setAttribute("transform", `translate(${500 + (s[2] > 0 ? 8 * s[2] * Math.sin(lt * 10) : 0)} 420)`); },
  (lt) => { document.querySelectorAll(".g2b").forEach((b) => { const i = +b.dataset.i; b.style.transform = `scaleY(${easeOut(clamp((lt - 0.6 - i * 0.07) / 0.5))})`; });
    document.querySelectorAll(".g2n").forEach((n) => { n.style.opacity = clamp((lt - 0.8 - +n.dataset.i * 0.07) / 0.4); });
    op($("g2med"), clamp((lt - 2.8) / 0.4)); op($("g2medt"), clamp((lt - 2.8) / 0.4)); op($("g2hot"), clamp((lt - 2.6) / 0.4)); op($("g2cold"), clamp((lt - 3.4) / 0.4)); },
  (lt) => { const p = easeInOut(clamp((lt - 0.6) / 4.6)); $("g3clip").setAttribute("width", 110 + 830 * p);
    document.querySelectorAll(".g3st").forEach((e) => op(e, clamp((lt - 0.7) / 0.4))); document.querySelectorAll(".g3end").forEach((e, k) => op(e, clamp((lt - 5.2 - k * 0.25) / 0.4))); },
  (lt) => { const p = clamp((lt - 0.6) / 9.0), f = p * N, [x, y, v, i] = lapAt(f);
    $("g4car").setAttribute("transform", `translate(${40 + x * 0.7} ${50 + y * 0.7})`);

    const cx = 500 + 460 * KM(Math.min(N, Math.round(f))) / 6.201; $("g4cur").setAttribute("x1", cx); $("g4cur").setAttribute("x2", cx);
    $("g4v").setAttribute("x", Math.min(930, Math.max(540, cx))); $("g4v").setAttribute("y", 166 + 0 * v); $("g4v").textContent = Math.round(v);
    op($("g4flat"), clamp((lt - 6.0) / 0.5)); op($("g4chips"), clamp((lt - 7.0) / 0.5)); op($("g4slow"), clamp((lt - 10.6) / 0.4)); },
  (lt) => { const slide = clamp((lt - 1.2) / 0.4), g = clamp((lt - 2.6) / 3.2);
    $("g5tyre").setAttribute("transform", `translate(${slide * 14 * Math.sin(lt * 30)} 0)`); $("g5road").setAttribute("transform", `translate(${-((lt * 260) % 40)} 0)`);
    op($("g5arrow"), slide); document.querySelectorAll(".g5r").forEach((r) => { const k = +r.dataset.k, q = clamp((g * 18 - k) / 1.5); r.setAttribute("opacity", q); r.setAttribute("ry", 4 + 10 * q); });
    $("g5tread").setAttribute("fill", g > 0.5 ? "#FF7A1A" : "#7FD3FF"); op($("g5lab"), clamp((lt - 4.6) / 0.4)); op($("g5loop"), clamp((lt - 6.6) / 0.4)); },
  (lt) => { document.querySelectorAll(".g6row").forEach((row) => { const b = +row.dataset.b, r = +row.dataset.r, p = easeInOut(clamp((lt - 0.8 - b * 1.4 - r * 0.06) / 1.0));
      row.style.clipPath = `inset(-6px ${100 - 100 * p}% -6px 0)`; }); },
  (lt) => { document.querySelectorAll(".g7b").forEach((b, k) => b.style.transform = `scaleX(${easeOut(clamp((lt - 0.5 - k * 0.25) / 0.8))})`);
    op($("g7t"), clamp((lt - 2.6) / 0.5)); const f = $("ctaf"); if (f) { const q = clamp((lt - 3.4) / 0.45); f.style.opacity = q; f.style.transform = `scale(${0.6 + 0.4 * back(q)})`; } },
];
async function renderSoundtrack(rate) { const ctx = new OfflineAudioContext(2, Math.ceil(rate * DURATION), rate); return ctx.startRendering(); }   // silent: voiceover added in the edit
window.reel = { DURATION, seek, renderSoundtrack, T0, CH, W: SW, H: SH };
seek(location.hash ? +location.hash.slice(1) : 4);
</script>
