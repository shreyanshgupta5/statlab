  grain: () => { let ridges = ""; for (let k = 0; k < 16; k++) ridges += `<ellipse class="rg" data-k="${k}" cx="${150 + k * 38}" cy="214" rx="13" ry="9" fill="#2A2E36" stroke="#555D69" stroke-width="3"/>`;
    return `<svg viewBox="0 0 900 640" width="880" height="626">
      <text x="450" y="40" text-anchor="middle" class="lbl">TYRE TREAD · SIDE VIEW</text>
      <g class="tyre"><rect x="110" y="220" width="680" height="190" rx="40" fill="#15181E" stroke="#3A4452" stroke-width="5"/>
        <rect class="tread" x="110" y="220" width="680" height="64" rx="30" fill="#7FD3FF" opacity=".55"/>${ridges}</g>
      <rect x="40" y="430" width="820" height="26" fill="#2A3038"/><g class="road">${Array.from({ length: 22 }, (_, k) => `<rect x="${40 + k * 40}" y="440" width="22" height="6" fill="#4A525E"/>`).join("")}</g>
      <g class="arrow"><line x1="300" y1="540" x2="600" y2="540" stroke="#FF3B30" stroke-width="10"/><path d="M600 516 L650 540 L600 564 Z" fill="#FF3B30"/><text x="450" y="600" text-anchor="middle" class="lbl" style="fill:#FF3B30">SLIDING, NOT GRIPPING</text></g>
      <g class="gl"><line x1="700" y1="150" x2="610" y2="200" stroke="#FFB000" stroke-width="4"/><text x="706" y="140" class="lbl" style="fill:#FFB000">GRAINING</text></g></svg>`; },
  rings: () => `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;width:100%">${SHARE.map(([y, h, m, st], k) => `<div style="display:flex;flex-direction:column;align-items:center;gap:14px">
      <svg viewBox="0 0 200 200" width="250" height="250"><circle cx="100" cy="100" r="96" fill="#0E0E10" stroke="#000" stroke-width="3"/><circle cx="100" cy="100" r="74" fill="none" stroke="#26262B" stroke-width="18"/>
        <circle class="rm" data-k="${k}" data-len="${h + m}" cx="100" cy="100" r="74" fill="none" stroke="#FFD400" stroke-width="18" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 100 100)"/>
        <circle class="rh" data-k="${k}" data-len="${h}" cx="100" cy="100" r="74" fill="none" stroke="#F2F2F0" stroke-width="18" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 100 100)" style="filter:drop-shadow(0 0 5px rgba(255,255,255,.5))"/>
        <circle cx="100" cy="100" r="56" fill="#15161A"/><text class="rv led" data-k="${k}" data-v="${h}" x="100" y="110" text-anchor="middle" font-size="44" fill="#F2F2F0">0%</text><text x="100" y="134" text-anchor="middle" font-family="JetBrains Mono" font-size="14" fill="#7D838C" letter-spacing="2">HARD</text></svg>
      <span class="led" style="font-size:38px;color:#C9CDD2">${y}</span><span class="chip rs" data-k="${k}" style="font-size:30px;padding:10px 18px;${st === "1 STOP" ? "border-color:#5BE38F;color:#5BE38F" : ""}">${st}</span></div>`).join("")}</div>
    <div style="display:flex;gap:28px;justify-content:center;margin-top:30px"><span class="lbl" style="color:#F2F2F0">■ HARD</span><span class="lbl" style="color:#FFD400">■ MEDIUM</span></div>`,
  cta: () => `<div style="margin-top:20px;font-family:var(--hand);color:var(--yellow);font-size:82px;transform:rotate(-3deg)" class="ctaq">who switches them on first? 👇</div>
    <div class="follow ctaf"><span class="plus">+</span><span>FOLLOW FOR MORE <b>F1 EXPLAINED</b></span></div>
    <div class="lbl" style="margin-top:40px">LAS VEGAS GP · SAT 21 NOV · 8PM LOCAL</div>`,
};
document.getElementById("scenes").innerHTML = BEATS.map((b, i) => `<section class="scene" data-i="${i}">
  <h2 class="h">${b.words.map(([w, c]) => `<span class="w ${c}">${w}</span>`).join(" ")}</h2>
  <div class="dia">${DIA[b.dia]()}</div>${b.sub ? `<div class="sub">${b.sub}</div>` : ""}</section>`).join("");
document.getElementById("snow").innerHTML = Array.from({ length: 40 }, () => "<i></i>").join("");

/* ---------- timeline ---------- */
const scenes = [...document.querySelectorAll(".scene")], sweep = document.querySelector(".sweep"), flakes = [...document.querySelectorAll("#snow i")];
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const lapAt = (f) => { const N = LAP.length - 1, i = Math.min(N - 1, Math.floor(f)), k = f - i, a = LAP[i], b = LAP[i + 1]; return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[3]]; };
const op = (el, v) => el && (el.style.opacity = v);
function seek(t) {
  scenes.forEach((sc, i) => {
    const lt = t - T0[i], d = BEATS[i].d; let x = 0;
    const vis = lt > -TR && lt < d + 0.01; sc.style.display = vis ? "flex" : "none"; if (!vis) return;
    if (i > 0 && lt < 0) x = 1080 * easeInOut(clamp(-lt / TR));
    if (i < scenes.length - 1 && lt > d - TR) x = -1080 * easeInOut(clamp((lt - (d - TR)) / TR));
    sc.style.transform = `translateX(${x}px)`;
    sc.querySelectorAll(".h .w").forEach((w, k) => { const p = clamp((lt - 0.1 - k * 0.22) / 0.35); w.style.opacity = p; w.style.transform = `translateY(${(1 - easeOut(p)) * 50}px)`; });
    const sub = sc.querySelector(".sub"); if (sub) { const p = clamp((lt - 1.2) / 0.5); sub.style.opacity = p; sub.style.transform = `translateY(${(1 - easeOut(p)) * 30}px)`; }
    beat[BEATS[i].dia](sc, lt, d);
  });
  document.getElementById("prog").style.width = (100 * t / DURATION) + "%";
  const cur = BEATS[Math.max(0, T0.findIndex((s, i) => t >= s && t < s + BEATS[i].d))] || BEATS[0];
  document.getElementById("src").textContent = cur.src || "DATA: OPENF1";
  const cold = clamp((t - T0[2] + 0.3) / 0.8) * clamp((T0[5] - t) / 0.6);       // snow over the cold beats
  document.getElementById("snow").style.opacity = cold * 0.8;
  if (cold > 0) flakes.forEach((f, i) => { const sp = 70 + 90 * rnd(i), sz = 4 + 7 * rnd(i + 99); f.style.width = f.style.height = sz + "px"; f.style.opacity = 0.2 + 0.5 * rnd(i + 7);
    f.style.left = (1080 * rnd(i + 31) + 30 * Math.sin(t * 0.8 + i)) + "px"; f.style.top = (((t * sp + 1920 * rnd(i + 57)) % 1700) + 100) + "px"; });
  let sw = -1; T0.slice(1).forEach((c) => { const q = (t - (c - TR)) / TR; if (q >= 0 && q <= 1) sw = q; });
  sweep.style.opacity = sw < 0 ? 0 : 0.8 * Math.sin(Math.PI * sw); sweep.style.left = (sw < 0 ? -400 : -400 + 1900 * sw) + "px";
}
const beat = {
  hook: (sc, lt) => { const p = easeInOut(clamp((lt - 0.4) / 2.6)); sc.querySelector(".hookline").style.strokeDashoffset = 1 - p;
    const [x, y] = lapAt(((lt - 0.4) / 2.6 < 1 ? p : (((lt - 3.0) / 4) % 1)) * (LAP.length - 1)); sc.querySelector(".hookcar").setAttribute("transform", `translate(${x} ${y})`); op(sc.querySelector(".hookcar"), lt > 0.4 ? 1 : 0); },
  gauge: (sc, lt) => { const p1 = easeInOut(clamp((lt - 1.4) / 1.6)), p2 = clamp((lt - 4.0) / 0.8);
    const v = 20 + 80 * p1 - 0 * p2, wob = lt > 3 ? 3 * Math.sin(lt * 7) * (1 - clamp((lt - 3) / 1.5)) : 0;
    sc.querySelector(".needle").setAttribute("transform", `rotate(${-90 + 180 * (v + wob) / 160} 300 300)`);
    sc.querySelector(".gval").textContent = Math.round(v) + "°C"; sc.querySelector(".gval").setAttribute("fill", v > 88 ? "#5BE38F" : "#7FD3FF");
    op(sc.querySelector(".win"), 0.35 + 0.65 * clamp((lt - 2.8) / 0.4) * (0.75 + 0.25 * Math.sin(lt * 6))); },
  temps: (sc, lt) => { const n = TEMPS.length; sc.querySelectorAll(".tb").forEach((b) => { const i = +b.dataset.i, p = easeOut(clamp((lt - 1.0 - i * 0.07) / 0.5)); b.style.transform = `scaleY(${p})`; });
    sc.querySelectorAll(".medline").forEach((e) => op(e, clamp((lt - 3.0) / 0.4))); op(sc.querySelector(".hot"), clamp((lt - 2.9) / 0.4)); op(sc.querySelector(".cold"), clamp((lt - 3.6) / 0.4));
    const c = sc.querySelector(".cold"); if (c) c.style.transform = `scale(${lt > 3.6 ? 1 + 0.04 * Math.sin(lt * 5) : 1})`; },
  lap: (sc, lt) => { const N = LAP.length - 1, f = (clamp((lt - 1.0) / 6.0)) * N, [x, y, th] = lapAt(f);
    sc.querySelector(".lapcar").setAttribute("transform", `translate(${x} ${y})`);
    let heat = 0.55; for (let i = 0; i < Math.floor(f); i++) heat += LAP[i][3] >= 99 ? -0.0042 : 0.0062; heat = Math.max(0.12, Math.min(0.75, heat));   // illustrative: straights cool, corners warm
    const r = sc.querySelector(".tfill"), h = 276 * heat; r.setAttribute("y", 298 - h); r.setAttribute("height", h); r.setAttribute("fill", heat > 0.62 ? "#5BE38F" : "#7FD3FF");
    op(sc.querySelector(".ff"), clamp((lt - 4.5) / 0.4)); },
  grain: (sc, lt) => { const slide = clamp((lt - 1.4) / 0.4), g = clamp((lt - 2.4) / 2.6);
    sc.querySelector(".tyre").setAttribute("transform", `translate(${slide * 14 * Math.sin(lt * 30)} 0)`);
    sc.querySelector(".road").setAttribute("transform", `translate(${-((lt * 260) % 40)} 0)`); op(sc.querySelector(".arrow"), slide);
    sc.querySelectorAll(".rg").forEach((r) => { const k = +r.dataset.k, p = clamp((g * 16 - k) / 1.5); r.style.opacity = p; r.setAttribute("ry", 4 + 9 * p); });
    op(sc.querySelector(".gl"), clamp((lt - 4.0) / 0.4)); sc.querySelector(".tread").setAttribute("fill", g > 0.5 ? "#FF7A1A" : "#7FD3FF"); },
  rings: (sc, lt) => { sc.querySelectorAll(".rh,.rm").forEach((c) => { const k = +c.dataset.k, p = easeInOut(clamp((lt - 1.2 - k * 0.6) / 1.2)); c.setAttribute("stroke-dasharray", `${(+c.dataset.len) * p} 100`); });
    sc.querySelectorAll(".rv").forEach((c) => { const k = +c.dataset.k, p = easeOut(clamp((lt - 1.2 - k * 0.6) / 1.2)); c.textContent = Math.round(+c.dataset.v * p) + "%"; });
    sc.querySelectorAll(".rs").forEach((c) => { const k = +c.dataset.k, p = clamp((lt - 3.6 - k * 0.4) / 0.35); c.style.opacity = p; c.style.transform = `scale(${0.6 + 0.4 * back(p)})`; }); },
  cta: (sc, lt) => { const a = sc.querySelector(".ctaq"), b = sc.querySelector(".ctaf"); const p = clamp((lt - 1.4) / 0.45), q = clamp((lt - 2.4) / 0.45);
    a.style.opacity = p; a.style.transform = `rotate(-3deg) scale(${0.6 + 0.4 * back(p)})`; b.style.opacity = q; b.style.transform = `scale(${0.6 + 0.4 * back(q)})`; },
};
// silent: the voiceover and music go on in the edit
async function renderSoundtrack(rate) { const ctx = new OfflineAudioContext(2, Math.ceil(rate * DURATION), rate); return ctx.startRendering(); }
window.reel = { DURATION, seek, renderSoundtrack, T0, BEATS };
seek(location.hash ? +location.hash.slice(1) : 3);
</script>
