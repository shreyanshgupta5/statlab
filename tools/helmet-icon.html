<!doctype html>
<html><head><meta charset="utf-8">

<style>html,body{margin:0;background:#000}svg{display:block}</style></head>
<body>
<!-- Realistic ONE F1 helmet icon. ?theme=NAME renders one 1024px icon; tools/make_helmet.js screenshots it. -->

<script>

};

<rect width="1024" height="1024" fill="url(#bgg)"/><rect width="1024" height="1024" fill="url(#twill)"/>
<g transform="translate(-44 -6)">

    <path d="${STRIPE}" fill="url(#stripe)"/>

    <path d="M330 286 C420 238 520 226 600 234" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="${th.matte ? .12 : .9}"/>

  </g>
  <path d="${VISOR}" fill="none" stroke="#050506" stroke-width="16" stroke-linejoin="round"/>

  <g clip-path="url(#visorClip)">
    <text x="716" y="508" text-anchor="middle" style="font:italic 900 118px Archivo;font-stretch:125%;letter-spacing:-2px" fill="none" stroke="${th.neon}" stroke-width="7" filter="url(#neon)">F1</text>
    <text x="716" y="508" text-anchor="middle" style="font:italic 900 118px Archivo;font-stretch:125%;letter-spacing:-2px" fill="none" stroke="#fff" stroke-width="1.6" opacity=".85">F1</text>
    <path d="M520 392 L700 392 L600 556 L460 556 Z" fill="url(#sky)"/>
    <rect x="560" y="398" width="300" height="8" rx="4" fill="#fff" opacity=".12"/>
  </g>

  <g fill="#fff" opacity=".25"><rect x="806" y="686" width="62" height="2" rx="1"/><rect x="800" y="704" width="56" height="2" rx="1"/></g>
</g>
<ellipse cx="556" cy="738" rx="350" ry="20" fill="#000" opacity=".75" filter="url(#soft)"/>
<g mask="url(#reflMask)"><use href="#helmet" transform="translate(0 1464) scale(1 -1)"/></g>
</g>
<rect width="1024" height="1024" fill="url(#vig)"/>
`;
window.LABEL = th.label; window.THEMES = Object.keys(THEMES);
</script>
</body></html>
