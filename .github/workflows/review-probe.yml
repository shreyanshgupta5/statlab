name: review-probe
on:
  push:
    branches: [claude/busy-bardeen-4x4249]
    paths: ['research/**', '.github/workflows/review-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests google-play-scraper
      - run: python research/probe.py
