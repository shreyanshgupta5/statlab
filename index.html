<script>
/* Launch splash: the ONE F1 wordmark on the app's black, held briefly, then it glides into the header logo.
   Once per app launch; skipped for reduced motion. A tap skips it. */
(function () {
  var sp = document.getElementById("splash");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var seen = false; try { seen = sessionStorage.getItem("onef1-splash") === "1"; sessionStorage.setItem("onef1-splash", "1"); } catch (e) {}
  if (reduce || seen) { sp.remove(); return; }
  document.documentElement.classList.add("splashing");
  requestAnimationFrame(function () { sp.classList.add("out"); });   // starts the logo fade-in
  var done = false;
  function finish() {
    if (done) return; done = true;
    var lg = sp.querySelector(".sp-logo"), hd = document.querySelector(".top .wm");
    sp.classList.add("land");
    if (lg && hd && hd.getBoundingClientRect().width) {
      lg.style.animation = "none"; lg.style.opacity = 1; lg.style.transform = "none";
      lg.querySelectorAll("*").forEach(function (e) { e.style.animation = "none"; e.style.opacity = 1; e.style.transform = "none"; });
      var a = lg.getBoundingClientRect(), b = hd.getBoundingClientRect();
      var s = b.width / a.width, dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
      void lg.offsetWidth;
      lg.style.transition = "transform .7s cubic-bezier(.6,0,.2,1)";
      lg.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + s + ")";
    }
    setTimeout(function () { document.documentElement.classList.remove("splashing"); sp.classList.add("gone"); }, 720);
    setTimeout(function () { sp.remove(); }, 1000);
  }
  sp.addEventListener("pointerdown", finish);
  setTimeout(finish, 2600);
})();
</script>

<script>
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => reg.update()).catch(() => {}));
    // when a new version takes over, reload once so the new files show straight away
    let reloaded = false;
    const hadController = !!navigator.serviceWorker.controller;   // first install: no reload needed
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  }
</script>
