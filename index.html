<script>
/* Launch splash: five start lights, lights out, logo sweep. Once per app launch; skipped for reduced motion.
   Sound is synthesised (no files). Browsers only allow audio after a tap, so it plays if permitted, and a tap on
   the splash skips it with the lights-out sound. */
(function () {
  var sp = document.getElementById("splash");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var seen = false; try { seen = sessionStorage.getItem("onef1-splash") === "1"; sessionStorage.setItem("onef1-splash", "1"); } catch (e) {}
  if (reduce || seen) { sp.remove(); return; }
  document.documentElement.classList.add("splashing");
  var ctx = null;
  function audio() { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (ctx.state === "suspended") ctx.resume(); return ctx; }
  function beep(t, f, d, v) { var c = audio(); if (!c || c.state !== "running") return; var o = c.createOscillator(), g = c.createGain(); o.type = "square"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, c.currentTime + t); g.gain.exponentialRampToValueAtTime(v, c.currentTime + t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t + d);
    var lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2200; o.connect(lp).connect(g).connect(c.destination); o.start(c.currentTime + t); o.stop(c.currentTime + t + d + 0.05); }
  function roar(t) { var c = audio(); if (!c || c.state !== "running") return; var n = c.createBuffer(1, c.sampleRate, c.sampleRate), d = n.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    var s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), o = c.createOscillator(), og = c.createGain(), T = c.currentTime + t;
    s.buffer = n; f.type = "bandpass"; f.Q.value = 1.4; f.frequency.setValueAtTime(400, T); f.frequency.exponentialRampToValueAtTime(5000, T + 0.6);
    g.gain.setValueAtTime(0.0001, T); g.gain.exponentialRampToValueAtTime(0.35, T + 0.25); g.gain.exponentialRampToValueAtTime(0.0001, T + 0.9);
    o.type = "sawtooth"; o.frequency.setValueAtTime(90, T); o.frequency.exponentialRampToValueAtTime(420, T + 0.7); og.gain.setValueAtTime(0.0001, T); og.gain.exponentialRampToValueAtTime(0.08, T + 0.15); og.gain.exponentialRampToValueAtTime(0.0001, T + 0.8);
    var olp = c.createBiquadFilter(); olp.type = "lowpass"; olp.frequency.value = 1200;
    s.connect(f).connect(g).connect(c.destination); o.connect(olp).connect(og).connect(c.destination); s.start(T); s.stop(T + 1); o.start(T); o.stop(T + 0.9); }
  var LIGHT = 0.5, OUT = 5 * LIGHT + 0.7, MK = OUT + 1.7, END = MK + 4.9;   // lights, lights out + wordmark, then the O1 mark with its speedometer
  for (var k = 0; k < 5; k++) beep(0.2 + k * LIGHT, 880, 0.14, 0.08);
  roar(OUT);
  function rev(t) { var c = audio(); if (!c || c.state !== "running") return; var T = c.currentTime + t, o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
    o.type = "sawtooth"; o2.type = "square"; lp.type = "lowpass"; lp.frequency.value = 1400;
    var pts = [[0, 90], [0.6, 520], [1.08, 170], [1.68, 470], [2.04, 360], [2.4, 400]];   // follows the needle sweep
    pts.forEach(function (p, i) { [o, o2].forEach(function (x, j) { var f = p[1] * (j ? 0.5 : 1); if (i === 0) x.frequency.setValueAtTime(f, T); else x.frequency.exponentialRampToValueAtTime(f, T + p[0]); }); });
    g.gain.setValueAtTime(0.0001, T); g.gain.exponentialRampToValueAtTime(0.05, T + 0.15); g.gain.setValueAtTime(0.05, T + 2.2); g.gain.exponentialRampToValueAtTime(0.0001, T + 2.8);
    o.connect(lp); o2.connect(lp); lp.connect(g).connect(c.destination); o.start(T); o2.start(T); o.stop(T + 2.9); o2.stop(T + 2.9); }
  rev(MK + 1.2);
  var done = false;
  function finish() { if (done) return; done = true; sp.classList.add("gone"); document.documentElement.classList.remove("splashing"); setTimeout(function () { sp.remove(); }, 750); }
  sp.addEventListener("pointerdown", function () { if (sp.classList.contains("out")) { finish(); return; } audio(); roar(0); sp.classList.add("out"); setTimeout(finish, 700); });
  setTimeout(function () { sp.classList.add("out"); }, OUT * 1000);
  setTimeout(function () { sp.classList.add("mk"); }, MK * 1000);
  setTimeout(finish, END * 1000);
})();
</script>
